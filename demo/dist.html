<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar prototype — dist smoke</title>
  <link rel="stylesheet" href="../dist/calendar.css">
  <script src="../dist/calendar.js"></script>
  <style>
    body { margin: 0; padding: 2rem; background: #eef1f6; font-family: system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
  </style>
</head>
<body>
<main>
  <h1>Dist smoke</h1>
  <p>
    This page always loads the generated classic build (<code>../dist/calendar.js</code>),
    so it validates the distributed product and works identically over
    <code>http(s)</code> and <code>file://</code>. Run <code>bun run sync</code>
    before opening it. The source ESM is exercised directly by the unit and browser suites.
  </p>
  <calendar-view view="threeDays" date="2026-09-03"></calendar-view>
</main>
<script>
  const calendar = document.querySelector("calendar-view");
  // Fixture data is Brussels-dated; pin the zone so the demo never depends
  // on the neutral UTC default.
  calendar.configure({ timeZone: "Europe/Brussels" });
  calendar.events = [
    { id: "a", title: "Design review", start: "2026-09-03T09:00:00+02:00[Europe/Brussels]", end: "2026-09-03T10:00:00+02:00[Europe/Brussels]" },
    { id: "b", title: "Planning", start: "2026-09-04T13:20:00+02:00[Europe/Brussels]", end: "2026-09-04T14:00:00+02:00[Europe/Brussels]" },
    { id: "c", title: "Overlap review", start: "2026-09-03T09:30:00+02:00[Europe/Brussels]", end: "2026-09-03T10:30:00+02:00[Europe/Brussels]" }
  ];
</script>
</body>
</html>
