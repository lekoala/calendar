<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar prototype — solo</title>
  <link rel="stylesheet" href="../dist/calendar.css">
  <script src="../dist/calendar.js"></script>
  <style>
    body { margin: 0; padding: 2rem; background: #eef1f6; font-family: system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    nav { display: flex; gap: .5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>Calendar views</h1>
  <p>Solo representations over shared state: time grids, month summary and list. Switching views preserves the anchor date.</p>
  <nav>
    <button type="button" data-view="day">Day</button>
    <button type="button" data-view="threeDays">3 days</button>
    <button type="button" data-view="week">Week</button>
    <button type="button" data-view="month">Month</button>
    <button type="button" data-view="list">List</button>
    <label>Locale
      <select id="locale">
        <option value="">System</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
      </select>
    </label>
  </nav>
  <calendar-view view="threeDays" date="2026-09-03"></calendar-view>
</main>
<script type="module">
  const calendar = document.querySelector("calendar-view");
  calendar.events = [
    { id: "a", title: "Design review", start: "2026-09-03T09:00:00+02:00[Europe/Brussels]", end: "2026-09-03T10:00:00+02:00[Europe/Brussels]" },
    { id: "b", title: "Planning", start: "2026-09-04T13:20:00+02:00[Europe/Brussels]", end: "2026-09-04T14:00:00+02:00[Europe/Brussels]" },
    { id: "c", title: "Overlap review", start: "2026-09-03T09:30:00+02:00[Europe/Brussels]", end: "2026-09-03T10:30:00+02:00[Europe/Brussels]" }
  ];
  calendar.backgrounds = [
    { id: "bg", start: "2026-09-03T08:00:00+02:00[Europe/Brussels]", end: "2026-09-03T12:00:00+02:00[Europe/Brussels]" }
  ];
  document.querySelector("nav").addEventListener("click", (event) => {
    const view = event.target.dataset.view;
    if (view) calendar.setView(view);
  });
  const strings = {
    fr: { more: "+{hidden} en plus", noEvents: "Aucun évènement", noResources: "Aucune ressource sélectionnée." },
    nl: { more: "+{hidden} meer", noEvents: "Geen gebeurtenissen", noResources: "Geen bronnen geselecteerd." },
  };
  document.querySelector("#locale").addEventListener("change", (event) => {
    const locale = event.target.value || undefined;
    calendar.configure({ locale, labels: locale && strings[locale] ? strings[locale] : {} });
  });
</script>
</body>
</html>
