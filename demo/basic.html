<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar prototype — solo</title>
  <link rel="stylesheet" href="../dist/calendar.css">
  <script src="../dist/calendar.js"></script>
  <style>
    body { margin: 0; padding: 2rem; background: #eef1f6; font: 0.875rem/1.4 system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    nav { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    nav .sep { color: #94a3b8; }
  </style>
</head>
<body>
<main>
  <h1>Calendar views</h1>
  <p>Solo representations over shared state: time grids, month summary and list. Switching views preserves the anchor date.</p>
  <nav>
    <span id="views">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="threeDays">3 days</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
      <button type="button" data-view="list">List</button>
    </span>
    <span class="sep" aria-hidden="true">|</span>
    <span id="durations">
      <button type="button" data-days="2" title="Custom duration">2 days</button>
      <button type="button" data-days="4" title="Custom duration">4 days</button>
      <button type="button" data-days="5" title="Custom duration">5 days</button>
      <button type="button" data-days="5" data-hiddendays="7" title="Custom duration">5 days · no Sunday</button>
      <button type="button" data-days="4" data-view="week" title="Week stays a civil week">Week + dayCount (ignored)</button>
    </span>
    <label>Locale
      <select id="locale">
        <option value="">System</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
      </select>
    </label>
  </nav>
  <p>Custom day counts override the rolling presets via <code>configure({ dayCount })</code>; switching views resets them. A week stays civil whatever is configured.</p>
  <calendar-view view="threeDays" date="2026-09-03"></calendar-view>
</main>
<script type="module">
  const calendar = document.querySelector("calendar-view");
  // Fixture data is Brussels-dated; pin the zone so the demo never depends
  // on the neutral UTC default.
  calendar.configure({ timeZone: "Europe/Brussels" });
  calendar.events = [
    { id: "a", title: "Design review", start: "2026-09-03T09:00:00+02:00[Europe/Brussels]", end: "2026-09-03T10:00:00+02:00[Europe/Brussels]" },
    { id: "b", title: "Planning", start: "2026-09-04T13:20:00+02:00[Europe/Brussels]", end: "2026-09-04T14:00:00+02:00[Europe/Brussels]" },
    { id: "c", title: "Overlap review", start: "2026-09-03T09:30:00+02:00[Europe/Brussels]", end: "2026-09-03T10:30:00+02:00[Europe/Brussels]" }
  ];
  calendar.backgrounds = [
    { id: "bg", start: "2026-09-03T08:00:00+02:00[Europe/Brussels]", end: "2026-09-03T12:00:00+02:00[Europe/Brussels]" }
  ];
  document.querySelector("#views").addEventListener("click", (event) => {
    const view = event.target.dataset.view;
    if (view) {
      // Presets own their day count: leaving a custom duration resets it.
      calendar.configure({ dayCount: undefined, hiddenDays: undefined });
      calendar.setView(view);
    }
  });
  document.querySelector("#durations").addEventListener("click", (event) => {
    const days = Number(event.target.dataset?.days);
    if (!Number.isInteger(days)) return;
    calendar.configure({
      dayCount: days,
      hiddenDays: event.target.dataset.hiddendays ? [Number(event.target.dataset.hiddendays)] : undefined,
    });
    calendar.setView(event.target.dataset.view ?? "day");
  });
  const strings = {
    fr: { more: "+{hidden} en plus", noEvents: "Aucun évènement", noResources: "Aucune ressource sélectionnée." },
    nl: { more: "+{hidden} meer", noEvents: "Geen gebeurtenissen", noResources: "Geen bronnen geselecteerd." },
  };
  document.querySelector("#locale").addEventListener("change", (event) => {
    const locale = event.target.value || undefined;
    calendar.configure({ locale, labels: locale && strings[locale] ? strings[locale] : {} });
  });
</script>
</body>
</html>
