name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  browser:
    runs-on: ubuntu-latest
    needs: verify
    # Each shard keeps the 4 workers the config allows for stability and works
    # on its own 4 vCPU runner, so sharding cuts wall time without raising
    # per-job parallelism.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `verify` already ran `sync` and its generated-artifact gate, so each
      # shard can trust the committed dist instead of rebuilding three times.
      - name: Browser behavior suite (${{ matrix.shard }}/3)
        run: bun run test:browser:all --shard=${{ matrix.shard }}/3
      # The dist smoke build is independent of sharding; run it once.
      - name: Dist smoke
        if: matrix.shard == 1
        run: bun run test:dist

  # The showcase drives the example application shell end to end (application
  # UI plus the classic-script build over `file://`). It is Chromium-only and
  # not part of the browser shards, so it gets its own job instead of running
  # three times.
  showcase:
    runs-on: ubuntu-latest
    needs: verify
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `verify` already regenerated and gated the committed dist.
      - name: Showcase suite
        run: bun run test:showcase
